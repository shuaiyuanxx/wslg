# Podman storage configuration for WSLC system distro.
#
# WSLC mounts storage.vhdx (per-session ext4 block device) at /var/lib/containers.
# See src/windows/wslcsession/WSLCSession.cpp: c_containerdStorage constant.
#
# graphroot must NOT fall under the system distro's overlayfs `/` — the kernel
# refuses to stack overlayfs on overlayfs. Pointing it at /var/lib/containers (the
# storage.vhdx mount point) puts container layers on a real ext4 filesystem.
# This mirrors dockerd's --data-root setup; the two engines use disjoint
# subdirectories (dockerd: overlay2/, containers/; podman: overlay/, overlay-containers/).

[storage]
driver = "overlay"
graphroot = "/var/lib/containers"
runroot = "/run/containers/storage"

[storage.options]

[storage.options.overlay]
mountopt = "nodev"
