# Default container registries for podman in WSLC system distro.
# Match docker behavior: pull "alpine" → docker.io/library/alpine
# mcr.microsoft.com is included as a fallback for Microsoft container images.

unqualified-search-registries = ["docker.io", "mcr.microsoft.com", "quay.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry]]
prefix = "mcr.microsoft.com"
location = "mcr.microsoft.com"

# Treat loopback addresses as insecure to match docker's hardcoded
# 127.0.0.0/8 + ::1/128 behavior (registry/config.go). podman defaults to
# HTTPS for every registry and would otherwise fail with
# "http: server gave HTTP response to HTTPS client" against a plain-HTTP
# local registry — which is the common pattern for both developer setups
# and E2E test fixtures. This entry is what makes push/pull (which goes
# through containers/image FindRegistry) tolerate HTTP for local registries;
# login goes through podman's docker-compat /auth handler which has its own
# hardcoded "localhost:" short-circuit.
[[registry]]
location = "localhost"
insecure = true

[[registry]]
location = "127.0.0.1"
insecure = true

[[registry]]
location = "[::1]"
insecure = true
